[package]
name = "recs-bench"
version = "0.1.0"
edition = "2024"

[dependencies]
recs = { path = ".." }
bevy_ecs = { version = "0.20", default-features = false, features = ["std"] }

[dev-dependencies]
criterion = "0.7"

[[bench]]
name = "recs"
path = "benches/recs.rs"
harness = false

[[bench]]
name = "bevy"
path = "benches/bevy.rs"
harness = false
