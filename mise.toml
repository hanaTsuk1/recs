[tasks.fmt]
description = "Format Rust code"
run = "cargo fmt"

[tasks.fmt-check]
description = "Check Rust formatting"
run = "cargo fmt --check"

[tasks.lint]
description = "Run Clippy"
run = "cargo clippy --all-targets --all-features -- -D warnings"

[tasks.lint-fix]
description = "Fix Clippy suggestions"
run = "cargo clippy --fix --allow-dirty --allow-staged --all-targets --all-features"

[tasks.test]
description = "Run tests"
run = "cargo test --all-features"

[tasks.check]
description = "Run all checks"
run = [
    { task = "fmt-check" },
    { task = "lint" },
    { task = "test" },
]

[tasks.bench]
description = "Run recs and Bevy ECS benchmarks and generate the heatmap report"
run = [
    "cargo bench -p recs-bench --bench recs",
    "cargo bench -p recs-bench --bench bevy",
    "bun run benches/scripts/report.ts",
]

[tasks.bench-recs]
description = "Run recs benchmarks and refresh the heatmap report"
run = [
    "cargo bench -p recs-bench --bench recs",
    "bun run benches/scripts/report.ts",
]

[tasks.bench-bevy]
description = "Run Bevy Table and SparseSet benchmarks and refresh the heatmap report"
run = [
    "cargo bench -p recs-bench --bench bevy",
    "bun run benches/scripts/report.ts",
]

[tasks.bench-report]
description = "Generate a heatmap from the latest Criterion results"
run = "bun run benches/scripts/report.ts"
